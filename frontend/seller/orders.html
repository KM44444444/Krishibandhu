<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — KrishiBandhu Seller</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<script src="../assets/js/common.js"></script>
<script src="../assets/js/api.js"></script>
<script>
const user = requireAuth(['seller']);
if (user) { renderLayout('seller', 'orders', user); loadPage(); }

const STATUS_OPTIONS = ['pending', 'accepted', 'shipped', 'delivered', 'cancelled'];

async function loadPage() {
    const content = document.getElementById('pageContent');
    content.innerHTML = `
        <h1 style="font-size:20px;font-weight:800;margin-bottom:18px;">Orders</h1>
        <div class="card"><table>
            <thead><tr><th>Product</th><th>Buyer</th><th>Qty</th><th>Amount</th><th>Date</th><th>Status</th></tr></thead>
            <tbody id="tblBody"><tr><td colspan="6" class="text-center"><div class="spinner"></div></td></tr></tbody>
        </table></div>
    `;
    await refresh();
}

async function refresh() {
    const tbody = document.getElementById('tblBody');
    try {
        const { items } = await api.get('/orders/seller/mine');
        if (items.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="text-center">No orders yet.</td></tr>'; return; }
        tbody.innerHTML = items.map(i => `
            <tr>
                <td><strong>${i.product_name}</strong></td>
                <td>${i.buyer_name}<br><span style="font-size:11px;color:var(--text-muted)">${i.buyer_phone || ''}</span></td>
                <td>${i.quantity}</td>
                <td>₹${(i.price * i.quantity).toLocaleString('en-IN')}</td>
                <td>${formatDate(i.order_date)}</td>
                <td>
                    <select class="form-control" style="padding:6px 8px;font-size:12px;" onchange="updateStatus(${i.order_id}, this.value)">
                        ${STATUS_OPTIONS.map(s => `<option value="${s}" ${s === i.order_status ? 'selected' : ''}>${s}</option>`).join('')}
                    </select>
                </td>
            </tr>
        `).join('');
    } catch (err) { tbody.innerHTML = `<tr><td colspan="6">${err.message}</td></tr>`; }
}

async function updateStatus(orderId, status) {
    try { await api.put(`/orders/${orderId}/status`, { status }); } catch (err) { alert(err.message); }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Consultation — KrishiBandhu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<script src="../assets/js/common.js"></script>
<script src="../assets/js/api.js"></script>
<script>
const user = requireAuth(['farmer']);
if (user) { renderLayout('farmer', 'video-consultation', user); loadPage(); }

async function loadPage() {
    const content = document.getElementById('pageContent');
    content.innerHTML = `
        <div class="flex-between mb-2">
            <h1 style="font-size:20px;font-weight:800;">Video Consultation</h1>
            <span class="pill pill-orange">REQUIRES PRODUCTION IMPLEMENTATION</span>
        </div>
        <p style="color:var(--text-muted);font-size:13px;margin-bottom:20px;max-width:640px;">
            The request/scheduling workflow below is fully functional. Live in-browser video calling (WebRTC) is a
            separate production integration step and is not active in this build.
        </p>
        <div class="dash-grid">
            <div class="col">
                <div class="card">
                    <div class="card-header"><h3>Video Call Interface (Preview)</h3></div>
                    <div style="background:#0f2419;border-radius:12px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.6);flex-direction:column;gap:10px;">
                        <i class="fa-solid fa-video-slash" style="font-size:32px;"></i>
                        <span style="font-size:12.5px;">Live video requires production WebRTC integration</span>
                    </div>
                    <div class="flex-gap mt-2" style="justify-content:center">
                        <button class="btn btn-outline btn-sm" disabled><i class="fa-solid fa-microphone"></i></button>
                        <button class="btn btn-danger btn-sm" disabled><i class="fa-solid fa-phone-slash"></i></button>
                        <button class="btn btn-outline btn-sm" disabled><i class="fa-solid fa-video"></i></button>
                    </div>
                </div>
                <div class="card mt-3">
                    <div class="card-header"><h3>Request a Video Consultation</h3></div>
                    <form id="vForm">
                        <div class="form-group"><label>Topic</label><textarea class="form-control" id="subject" placeholder="What would you like to discuss?" required></textarea></div>
                        <button type="submit" class="btn btn-primary">Request Video Slot</button>
                    </form>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <div class="card-header"><h3>My Video Requests</h3></div>
                    <div id="list"><div class="spinner"></div></div>
                </div>
            </div>
        </div>
    `;
    document.getElementById('vForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            await api.post('/consultations', { type: 'video', subject: document.getElementById('subject').value });
            document.getElementById('subject').value = '';
            await refresh();
        } catch (err) { alert(err.message); }
    });
    await refresh();
}

async function refresh() {
    const list = document.getElementById('list');
    try {
        const { consultations } = await api.get('/consultations/mine');
        const items = consultations.filter(c => c.type === 'video');
        if (items.length === 0) { list.innerHTML = '<div class="empty-state" style="padding:20px"><p>No video requests yet.</p></div>'; return; }
        list.innerHTML = items.map(c => `
            <div class="list-row">
                <div>
                    <div style="font-weight:600;font-size:13px;">${c.subject}</div>
                    <div style="font-size:11px;color:var(--text-muted)">${c.expert_name || 'Waiting for expert'} · ${timeAgo(c.created_at)}</div>
                </div>
                <span class="pill pill-orange">${c.status}</span>
            </div>
        `).join('');
    } catch (err) { list.innerHTML = `<p>${err.message}</p>`; }
}
</script>
</body>
</html>

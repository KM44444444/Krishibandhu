<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultation Requests — KrishiBandhu Expert</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<script src="../assets/js/common.js"></script>
<script src="../assets/js/api.js"></script>
<script>
const user = requireAuth(['expert']);
if (user) { renderLayout('expert', 'consultations', user); loadPage(); }

async function loadPage() {
    const content = document.getElementById('pageContent');
    content.innerHTML = `<h1 style="font-size:20px;font-weight:800;margin-bottom:18px;">Consultation Requests</h1><div id="list"><div class="spinner"></div></div>`;
    await refresh();
}

async function refresh() {
    const list = document.getElementById('list');
    try {
        const { consultations } = await api.get('/consultations/expert/mine');
        if (consultations.length === 0) { list.innerHTML = '<div class="card empty-state"><p>No requests yet.</p></div>'; return; }
        list.innerHTML = consultations.map(c => `
            <div class="card mb-2">
                <div class="flex-between">
                    <div>
                        <div style="font-weight:700;">${c.subject || 'General question'}</div>
                        <div style="font-size:12px;color:var(--text-muted)">${c.farmer_name} · ${c.farmer_phone || ''} · <span class="pill pill-blue">${c.type}</span> · ${timeAgo(c.created_at)}</div>
                    </div>
                    <div class="flex-gap">
                        <span class="pill ${c.status === 'open' ? 'pill-orange' : c.status === 'completed' ? 'pill-green' : 'pill-blue'}">${c.status}</span>
                        ${c.status === 'open' ? `<button class="btn btn-primary btn-sm" onclick="accept(${c.id})">Accept</button>` : ''}
                        ${c.type === 'chat' && c.status !== 'open' ? `<a href="chat.html?id=${c.id}" class="btn btn-outline btn-sm">Open Chat</a>` : ''}
                        ${c.status === 'in_progress' ? `<button class="btn btn-outline btn-sm" onclick="complete(${c.id})">Mark Complete</button>` : ''}
                    </div>
                </div>
            </div>
        `).join('');
    } catch (err) { list.innerHTML = `<div class="empty-state"><p>${err.message}</p></div>`; }
}

async function accept(id) {
    try { await api.put(`/consultations/${id}/accept`); await refresh(); } catch (err) { alert(err.message); }
}
async function complete(id) {
    try { await api.put(`/consultations/${id}/status`, { status: 'completed' }); await refresh(); } catch (err) { alert(err.message); }
}
</script>
</body>
</html>

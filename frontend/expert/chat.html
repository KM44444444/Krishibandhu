<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — KrishiBandhu Expert</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
<style>
.chat-wrap { display: grid; grid-template-columns: 300px 1fr; gap: 20px; height: calc(100vh - 180px); min-height: 480px; }
.chat-list { overflow-y: auto; }
.chat-thread { display: flex; flex-direction: column; }
.chat-messages { flex: 1; overflow-y: auto; padding: 6px 4px; }
.msg-bubble { max-width: 75%; padding: 10px 14px; border-radius: 14px; margin-bottom: 10px; font-size: 13.5px; }
.msg-mine { background: var(--green); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
.msg-theirs { background: var(--bg); border-bottom-left-radius: 4px; }
.msg-time { font-size: 10px; opacity: 0.7; margin-top: 4px; }
.chat-input-row { display: flex; gap: 10px; margin-top: 12px; }
</style>
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<script src="../assets/js/common.js"></script>
<script src="../assets/js/api.js"></script>
<script>
const user = requireAuth(['expert']);
if (user) { renderLayout('expert', 'chat', user); loadPage(); }

let activeConsultId = new URLSearchParams(window.location.search).get('id') || null;

async function loadPage() {
    const content = document.getElementById('pageContent');
    content.innerHTML = `
        <h1 style="font-size:20px;font-weight:800;margin-bottom:18px;">Chat with Farmers</h1>
        <div class="chat-wrap">
            <div class="card chat-list" id="chatList"><div class="spinner"></div></div>
            <div class="card chat-thread" id="chatThread"><div class="empty-state"><div class="icon"><i class="fa-solid fa-comments"></i></div><p>Select a conversation.</p></div></div>
        </div>
    `;
    await refreshList();
    if (activeConsultId) openThread(activeConsultId);
}

async function refreshList() {
    const list = document.getElementById('chatList');
    try {
        const { consultations } = await api.get('/consultations/expert/mine');
        const chats = consultations.filter(c => c.type === 'chat' && c.status !== 'open');
        if (chats.length === 0) { list.innerHTML = '<div class="empty-state" style="padding:20px"><p>No accepted chats yet.</p></div>'; return; }
        list.innerHTML = chats.map(c => `
            <div class="list-row" style="cursor:pointer" onclick="openThread(${c.id})">
                <div><div style="font-weight:600;font-size:13px;">${c.subject || 'Question'}</div><div style="font-size:11px;color:var(--text-muted)">${c.farmer_name} · ${timeAgo(c.created_at)}</div></div>
                <span class="pill ${c.status === 'completed' ? 'pill-green' : 'pill-blue'}">${c.status}</span>
            </div>
        `).join('');
    } catch (err) { list.innerHTML = `<p>${err.message}</p>`; }
}

async function openThread(id) {
    activeConsultId = id;
    await renderThread();
}

async function renderThread() {
    const thread = document.getElementById('chatThread');
    thread.innerHTML = '<div class="spinner"></div>';
    try {
        const { consultation, messages } = await api.get(`/consultations/${activeConsultId}/messages`);
        thread.innerHTML = `
            <div class="mb-2" style="border-bottom:1px solid var(--border);padding-bottom:12px;">
                <h4>${consultation.subject || 'Question'}</h4>
                <p style="font-size:11.5px;color:var(--text-muted)">with farmer</p>
            </div>
            <div class="chat-messages" id="msgArea">
                ${messages.length === 0 ? '<div class="empty-state"><p>No messages yet.</p></div>' :
                    messages.map(m => `<div class="msg-bubble ${m.sender_id === user.id ? 'msg-mine' : 'msg-theirs'}">${m.message}<div class="msg-time">${m.sender_name} · ${timeAgo(m.created_at)}</div></div>`).join('')}
            </div>
            <div class="chat-input-row">
                <input class="form-control" id="msgInput" placeholder="Type your reply...">
                <button class="btn btn-primary" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        `;
        const area = document.getElementById('msgArea');
        area.scrollTop = area.scrollHeight;
        document.getElementById('msgInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMsg(); });
    } catch (err) { thread.innerHTML = `<p>${err.message}</p>`; }
}

async function sendMsg() {
    const input = document.getElementById('msgInput');
    const message = input.value.trim();
    if (!message) return;
    input.value = '';
    try { await api.post(`/consultations/${activeConsultId}/messages`, { message }); await renderThread(); }
    catch (err) { alert(err.message); }
}
</script>
</body>
</html>

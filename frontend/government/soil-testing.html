<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soil Testing — KrishiBandhu Government</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>

<script src="../assets/js/common.js"></script>
<script src="../assets/js/api.js"></script>
<script>
const user = requireAuth(['government']);
if (user) { renderLayout('government', 'soil-testing', user); loadPage(); }

function getRequestIdFromUrl() {
    return new URLSearchParams(window.location.search).get('request');
}

async function loadPage() {
    const content = document.getElementById('pageContent');
    const requestId = getRequestIdFromUrl();

    if (!requestId) {
        content.innerHTML = `
            <h1 style="font-size:20px;font-weight:800;margin-bottom:18px;">Soil Testing</h1>
            <div class="card empty-state"><p>Select a request from the Soil Requests list to enter test results.</p><a href="soil-requests.html" class="btn btn-primary mt-2">Go to Soil Requests</a></div>
        `;
        return;
    }

    content.innerHTML = `<h1 style="font-size:20px;font-weight:800;margin-bottom:18px;">Soil Testing — Request #${requestId}</h1><div id="area"><div class="spinner"></div></div>`;

    try {
        const { request, report } = await api.get(`/soil/requests/${requestId}`);
        const area = document.getElementById('area');
        area.innerHTML = `
            <div class="card mb-3">
                <div class="card-header"><h3>Request Details</h3></div>
                <div class="farm-stats-strip" style="grid-template-columns:repeat(4,1fr)">
                    <div><span class="label">Farmer</span><span class="value">${request.farmer_name}</span></div>
                    <div><span class="label">Farm</span><span class="value">${request.farm_name || '—'}</span></div>
                    <div><span class="label">Location</span><span class="value">${request.location || '—'}</span></div>
                    <div><span class="label">Land Area</span><span class="value">${request.land_area || '—'} ${request.land_unit || ''}</span></div>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><h3>${report ? 'Verified Report' : 'Enter Physical Testing Results'}</h3></div>
                <p style="font-size:12px;color:var(--text-muted);margin-bottom:14px;">Enter the results obtained from the physical laboratory soil testing process. This becomes the farmer's official, verified soil report.</p>
                <form id="reportForm">
                    <div class="form-row">
                        <div class="form-group"><label>pH</label><input type="number" step="0.1" class="form-control" id="ph" value="${report?.ph ?? ''}" required></div>
                        <div class="form-group"><label>Moisture (%)</label><input type="number" step="0.1" class="form-control" id="moisture" value="${report?.moisture ?? ''}"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Nitrogen (kg/ha)</label><input type="number" step="0.1" class="form-control" id="nitrogen" value="${report?.nitrogen ?? ''}" required></div>
                        <div class="form-group"><label>Phosphorus (kg/ha)</label><input type="number" step="0.1" class="form-control" id="phosphorus" value="${report?.phosphorus ?? ''}" required></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Potassium (kg/ha)</label><input type="number" step="0.1" class="form-control" id="potassium" value="${report?.potassium ?? ''}" required></div>
                        <div class="form-group"><label>Organic Carbon (%)</label><input type="number" step="0.01" class="form-control" id="organic_carbon" value="${report?.organic_carbon ?? ''}"></div>
                    </div>
                    <div class="form-group"><label>Remarks</label><textarea class="form-control" id="remarks">${report?.remarks ?? ''}</textarea></div>
                    <div class="form-group">
                        <label>Lab Report File (PDF or photo, optional)</label>
                        <input type="file" class="form-control" id="reportFile" accept=".pdf,image/png,image/jpeg">
                        ${report?.report_file ? `<div class="form-hint">Current file: <a href="${getApiBaseUrl()}${report.report_file}" target="_blank">${report.report_file.split('/').pop()}</a></div>` : ''}
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">${report ? 'Update Report' : 'Submit & Verify Report'}</button>
                </form>
            </div>
        `;
        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = 'Submitting...';
            try {
                let report_file = report?.report_file || null;
                const fileInput = document.getElementById('reportFile');
                if (fileInput.files.length > 0) {
                    btn.textContent = 'Uploading file...';
                    const formData = new FormData();
                    formData.append('file', fileInput.files[0]);
                    const token = localStorage.getItem('kb_token');
                    const uploadRes = await fetch(`${getApiBaseUrl()}/api/uploads/soil-report`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    const uploadData = await uploadRes.json();
                    if (!uploadRes.ok || !uploadData.success) throw new Error(uploadData.message || 'File upload failed.');
                    report_file = uploadData.url;
                }
                btn.textContent = 'Submitting...';
                await api.post(`/soil/requests/${requestId}/report`, {
                    ph: parseFloat(document.getElementById('ph').value),
                    nitrogen: parseFloat(document.getElementById('nitrogen').value),
                    phosphorus: parseFloat(document.getElementById('phosphorus').value),
                    potassium: parseFloat(document.getElementById('potassium').value),
                    organic_carbon: parseFloat(document.getElementById('organic_carbon').value) || null,
                    moisture: parseFloat(document.getElementById('moisture').value) || null,
                    remarks: document.getElementById('remarks').value,
                    report_file,
                });
                alert('Report submitted and farmer notified.');
                window.location.href = 'soil-requests.html';
            } catch (err) {
                alert(err.message);
                btn.disabled = false; btn.textContent = 'Submit & Verify Report';
            }
        });
    } catch (err) {
        document.getElementById('area').innerHTML = `<div class="empty-state"><p>${err.message}</p></div>`;
    }
}
</script>
</body>
</html>
